name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
        working-directory: app
      - name: Typecheck
        run: npm run typecheck
        working-directory: app
      - name: Production build
        run: npm run build
        working-directory: app
      - name: Room staging break test (every captured room, seat and facing)
        run: npx -y tsx evidence/eval_staging.ts
